name: Release Electron app

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      source_ref:
        description: Commit or ref to release
        required: false
        default: master
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect release version
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - name: Resolve release version and source
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          semver_pattern='(?<![0-9A-Za-z.+-])v?\K(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?![0-9A-Za-z.+-])'

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_subject="$MANUAL_VERSION"
            source_ref="$MANUAL_SOURCE_REF"
          else
            release_subject="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq 'map(select(.merged_at != null)) | first | .title // ""')"
            source_ref="$GITHUB_SHA"
          fi

          version="$(grep -oP "$semver_pattern" <<< "$release_subject" | head -n 1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    uses: ./.github/workflows/build-electron.yml
    with:
      source_ref: ${{ needs.detect-version.outputs.source_ref }}
      version: ${{ needs.detect-version.outputs.version }}
    permissions:
      contents: read

  publish-release:
    name: Publish GitHub Release
    needs:
      - detect-version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ needs.detect-version.outputs.source_ref }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "v$RELEASE_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            "${prerelease[@]}"

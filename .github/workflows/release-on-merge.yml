name: Release Electron app

on:
  pull_request:
    branches:
      - master
    types:
      - closed

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract SemVer from pull request title
        id: version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          semver_pattern='(?<![0-9A-Za-z.+-])v?\K(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?![0-9A-Za-z.+-])'
          version="$(grep -oP "$semver_pattern" <<< "$PR_TITLE" | head -n 1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    uses: ./.github/workflows/build-electron.yml
    with:
      source_ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.detect-version.outputs.version }}
    permissions:
      contents: read

  publish-release:
    name: Publish GitHub Release
    needs:
      - detect-version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "v$RELEASE_VERSION" release-assets/* \
            --target "$MERGE_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            "${prerelease[@]}"

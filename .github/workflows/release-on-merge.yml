name: Release Electron app

on:
  pull_request:
    branches:
      - master
    types:
      - closed

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract SemVer from pull request title
        id: version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version="$(grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?' <<< "$PR_TITLE" | head -n 1 || true)"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows release
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Set package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: npm version $env:RELEASE_VERSION --no-git-tag-version
      - name: Package Windows app
        run: npm run package:windows
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ needs.detect-version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux release
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Set package version
        env:
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Package Linux app
        run: npm run package:linux
      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ needs.detect-version.outputs.version }}
          path: release/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - detect-version
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "v$RELEASE_VERSION" release-assets/* \
            --target "$MERGE_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            "${prerelease[@]}"
